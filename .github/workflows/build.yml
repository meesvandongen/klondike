name: Build Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.game }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-latest]
        game: [klondike, freecell, spider, tripeaks, pyramid, hearts]
        include:
          # MyGo needs no cgo, so each runner could build every platform;
          # macOS app bundles are still best signed on a Mac, and Windows
          # installers built where NSIS runs natively.
          - platform: macos-latest
            target_args: "-platform darwin/universal -skip-dmg"
            artifact_glob: "build/darwin-universal/*.zip"
          - platform: windows-latest
            target_args: "-platform windows/amd64"
            artifact_glob: "build/windows-amd64/*-setup-*.exe"
          - platform: ubuntu-latest
            target_args: "-platform linux/amd64"
            artifact_glob: |
              build/linux-amd64/*.deb
              build/linux-amd64/*.rpm
              build/linux-amd64/*.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node. --force overwrites the yarn
      # shim that Windows runners preinstall.
      - name: Enable corepack
        run: npm install -g --force corepack@latest && corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.game }}
        run: pnpm exec node scripts/app.mjs build ${{ matrix.game }} ${{ matrix.target_args }}

      - name: Zip macOS app bundle
        if: matrix.platform == 'macos-latest'
        run: |
          cd build/darwin-universal
          for app in *.app; do
            ditto -c -k --keepParent "$app" "${app%.app}.zip"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solitaire-${{ matrix.game }}-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
          generate_release_notes: true

  web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node. --force overwrites the yarn
      # shim that Windows runners preinstall.
      - run: npm install -g --force corepack@latest && corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./... && go test ./...

      # The generated client (src/shared/mygo.ts) is committed so the web
      # build needs no Go; fail if it is out of date with main.go.
      - run: pnpm run app:generate && git diff --exit-code src/shared/mygo.ts

      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: solitaire-web
          path: dist
          if-no-files-found: error
